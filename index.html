<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Thème choisi, posé avant le premier affichage pour éviter un éclair de noir (voir App.tsx).
      try {
        if (JSON.parse(localStorage.getItem('guitarecourse.theme')) === 'light') document.documentElement.dataset.theme = 'light'
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GuitareCourse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
