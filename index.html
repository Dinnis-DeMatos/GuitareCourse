<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Thème, couleur et thème des fêtes choisis, posés avant le premier affichage pour éviter un éclair (voir App.tsx et Options.tsx).
      try {
        if (JSON.parse(localStorage.getItem('guitarecourse.theme')) === 'light') document.documentElement.dataset.theme = 'light'
        const accent = JSON.parse(localStorage.getItem('guitarecourse.accent'))
        if (['surf', 'butterscotch', 'daphne', 'shell', 'turquoise'].includes(accent)) document.documentElement.dataset.accent = accent
        if (JSON.parse(localStorage.getItem('guitarecourse.festive')) === true) document.documentElement.dataset.season = 'fetes'
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GuitareCourse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
